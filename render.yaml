services:
  - type: web
    name: bloom-field-guide
    runtime: static
    branch: main
    buildCommand: ""
    staticPublishPath: ./public
  - type: web
    name: bloom-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: api
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: CORS_ORIGIN
        value: "https://bloom-field-guide.onrender.com,https://bloomhuyaah.netlify.app,http://localhost:8000"
